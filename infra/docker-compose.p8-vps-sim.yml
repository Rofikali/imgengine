# Local resource-constrained P8 rehearsal; NOT a production deployment or
# proof of a 1 GiB VPS. Rust and Nuxt use maintained minimal runtime images.
# No P7 development-image inheritance or untracked local Cargo cache.
name: imgengine-p8-vps-sim

services:
  rust-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    image: imgengine-p8-vps-rust-api:local
    environment:
      IMGENGINE_API_BIND: 0.0.0.0:8000
      IMGENGINE_API_KEYS: ${IMGENGINE_VPS_SIM_API_KEY:?set only by the simulation harness}
      IMGENGINE_WORKSPACE_ROOT: /tmp/imgengine-workspaces
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    memswap_limit: 640m
    cpus: "1.0"
    pids_limit: 128
    ulimits:
      nofile: { soft: 1024, hard: 1024 }
    tmpfs:
      - /tmp/imgengine-workspaces:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001,size=48m
    stop_grace_period: 30s
    healthcheck:
      # Check actual Rust readiness rather than a router's HTTP 405.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ../imgengine-saas/frontend
      dockerfile: Dockerfile
    image: imgengine-p8-vps-frontend:local
    depends_on:
      rust-api:
        condition: service_healthy
    environment:
      IMGENGINE_API_BASE: http://rust-api:8000
      IMGENGINE_RENDER_API_KEY: ${IMGENGINE_VPS_SIM_API_KEY:?set only by the simulation harness}
      # Nuxt applies NUXT_* runtime-config overrides when the production server
      # starts; the IMGENGINE_* names remain for the existing development path.
      NUXT_IMGENGINE_API_BASE: http://rust-api:8000
      NUXT_IMGENGINE_RENDER_API_KEY: ${IMGENGINE_VPS_SIM_API_KEY:?set only by the simulation harness}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    ulimits:
      nofile: { soft: 1024, hard: 1024 }
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 20s
    healthcheck:
      # Node is present in the frontend image; curl is not required.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  workload:
    build:
      context: ..
      dockerfile: infra/Dockerfile.p8-vps-workload
    image: imgengine-p8-vps-workload:local
    profiles: [workload]
    environment:
      P8_LAYOUT_URL: http://frontend:3000/api/layout-render
      P8_SHEET_URL: http://frontend:3000/api/sheet-render
    depends_on:
      frontend:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=24m
