# infra/docker-compose.yaml
services:


  api:
    build: ../backend/api-service
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      API_KEYS: ${API_KEYS:?set API_KEYS in your environment}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in your environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql://imgengine:imgengine@db:5432/imgengine
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-imgengine}

  worker:
    build:
      context: ../..
      dockerfile: imgengine-saas/backend/worker-service/Dockerfile

    command: uv run celery -A tasks worker --loglevel=info
    volumes:
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in your environment}
      API_URL: http://api:8000
      DATABASE_URL: postgresql://imgengine:imgengine@db:5432/imgengine
      RETENTION_CLEANUP_INTERVAL_SECONDS: ${RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
      RETENTION_CLEANUP_BATCH_SIZE: ${RETENTION_CLEANUP_BATCH_SIZE:-100}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-imgengine}

  cleanup:
    build:
      context: ../..
      dockerfile: imgengine-saas/backend/worker-service/Dockerfile
    command: /app/.venv/bin/celery -A tasks beat --loglevel=info
    volumes:
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://imgengine:imgengine@db:5432/imgengine
      RETENTION_CLEANUP_INTERVAL_SECONDS: ${RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
      RETENTION_CLEANUP_BATCH_SIZE: ${RETENTION_CLEANUP_BATCH_SIZE:-100}

  web:
    build: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8000
      NUXT_API_KEY: ${API_KEYS:?set API_KEYS in your environment}

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: imgengine
      POSTGRES_PASSWORD: imgengine
      POSTGRES_DB: imgengine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgengine -d imgengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    volumes:
      - ../data/logs:/data/logs
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    
  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP (your current exporter uses this)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  minio-data:
