name: imgengine-native-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  native-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y build-essential cmake ninja-build python3 clang-format imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm
      - name: Configure native build
        run: |
          cmake -S imgengine -B imgengine/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build native targets
        run: cmake --build imgengine/build/ci --parallel
      - name: Configure portable scalar reference build
        run: |
          cmake -S imgengine -B imgengine/build/portable-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_PORTABLE_BASELINE=ON \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build portable scalar reference targets
        run: cmake --build imgengine/build/portable-ci --parallel
      - name: Run portable scalar CTest suite
        run: ctest --test-dir imgengine/build/portable-ci --output-on-failure
      - name: Build benchmark targets
        run: cmake -S imgengine -B imgengine/build/bench-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=ON -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF && cmake --build imgengine/build/bench-ci --target bench_lat decoder_bench --parallel
      - name: Run CTest
        run: ctest --test-dir imgengine/build/ci --output-on-failure
      - name: Run CLI smoke test
        run: imgengine/build/ci/imgengine_cli --help
      - name: Run format check
        run: cmake --build imgengine/build/ci --target format-check
      - name: Run progressive JPEG regression
        run: cmake --build imgengine/build/ci --target regression_progressive
      - name: Run layout geometry regression
        run: cmake --build imgengine/build/ci --target regression_geometry
      - name: Compare optimized and portable scalar output
        run: bash imgengine/tests/regression/scalar_equivalence.sh imgengine/build/ci/imgengine_cli imgengine/build/portable-ci/imgengine_cli
      - name: Run hostile input regression
        run: cmake --build imgengine/build/ci --target regression_security
      - name: Check public ABI
        env:
          IMGENGINE_BUILD_DIR: ${{ github.workspace }}/imgengine/build/ci
        run: python3 imgengine/scripts/check_exported_symbols.py

  native-sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y build-essential cmake ninja-build imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm
      - name: Configure sanitizer build
        run: |
          cmake -S imgengine -B imgengine/build/sanitize-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_SANITIZE=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build sanitizer targets
        run: cmake --build imgengine/build/sanitize-ci --parallel
      - name: Run sanitizer CTest suite
        run: ctest --test-dir imgengine/build/sanitize-ci --output-on-failure
      - name: Run sanitizer progressive JPEG regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_progressive
      - name: Run sanitizer layout geometry regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_geometry
      - name: Run sanitizer hostile input regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_security

  native-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fuzzing dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y clang libclang-rt-dev cmake ninja-build imagemagick libturbojpeg-dev libnuma-dev liburing-dev
      - name: Configure libFuzzer target
        run: |
          CC=clang cmake -S imgengine -B imgengine/build/fuzz-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_FUZZ=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Run bounded input validator fuzzing
        run: imgengine/build/fuzz-ci/fuzz_input_validator -max_total_time=30 -max_len=4096
      - name: Run bounded JPEG and PNG decoder fuzzing
        run: |
          mkdir -p /tmp/imgengine-fuzz-corpus
          cp imgengine/photo.jpg /tmp/imgengine-fuzz-corpus/seed.jpg
          convert imgengine/photo.jpg -strip /tmp/imgengine-fuzz-corpus/seed.png
          imgengine/build/fuzz-ci/fuzz_decoder /tmp/imgengine-fuzz-corpus -max_total_time=60 -max_len=8388608

  saas-integration:
    runs-on: ubuntu-latest
    env:
      API_KEYS: integration-test-key
      WEB_API_KEY: integration-test-key
      INTERNAL_API_TOKEN: integration-internal-token
    steps:
      - uses: actions/checkout@v4
      - name: Install image fixture tooling
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y imagemagick
      - name: Build and start API, worker, Redis, and PostgreSQL
        working-directory: imgengine-saas/infra
        run: docker compose up --build -d api worker
      - name: Submit fixture and retrieve output
        working-directory: imgengine-saas/infra
        env:
          API_URL: http://127.0.0.1:8000
          API_KEY: integration-test-key
        run: |
          convert ../../imgengine/photo.jpg -strip /tmp/fixture.png
          convert ../../imgengine/photo.jpg -strip -interlace Plane /tmp/fixture-progressive.jpg
          convert ../../imgengine/photo.jpg -strip -colorspace CMYK /tmp/fixture-cmyk.jpg
          bash ../scripts/integration_smoke.sh ../../imgengine/photo.jpg image/jpeg
          bash ../scripts/integration_smoke.sh /tmp/fixture.png image/png
          bash ../scripts/integration_smoke.sh /tmp/fixture-progressive.jpg image/jpeg
          bash ../scripts/integration_smoke.sh /tmp/fixture-cmyk.jpg image/jpeg
      - name: Print service logs on failure
        if: failure()
        working-directory: imgengine-saas/infra
        run: docker compose logs --no-color
      - name: Stop integration stack
        if: always()
        working-directory: imgengine-saas/infra
        run: docker compose down --volumes --remove-orphans
