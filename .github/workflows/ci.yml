name: imgengine-native-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 install -y build-essential cmake ninja-build python3 clang-format imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Configure native build
        run: |
          cmake -S imgengine -B imgengine/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build native targets
        run: cmake --build imgengine/build/ci --parallel
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust supervisor tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/imgengine/build/ci
          RUSTFLAGS: -L native=${{ github.workspace }}/imgengine/build/ci
        run: cargo test --manifest-path imgengine/rust/imgengine-supervisor/Cargo.toml
      - name: Configure portable scalar reference build
        run: |
          cmake -S imgengine -B imgengine/build/portable-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_PORTABLE_BASELINE=ON \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build portable scalar reference targets
        run: cmake --build imgengine/build/portable-ci --parallel
      - name: Run portable scalar CTest suite
        run: ctest --test-dir imgengine/build/portable-ci --output-on-failure
      - name: Build benchmark targets
        run: cmake -S imgengine -B imgengine/build/bench-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=ON -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF && cmake --build imgengine/build/bench-ci --target bench_lat decoder_bench --parallel
      - name: Run CTest
        run: ctest --test-dir imgengine/build/ci --output-on-failure
      - name: Run CLI smoke test
        run: imgengine/build/ci/imgengine_cli --help
      - name: Run format check
        run: cmake --build imgengine/build/ci --target format-check
      - name: Run progressive JPEG regression
        run: cmake --build imgengine/build/ci --target regression_progressive
      - name: Run layout geometry regression
        run: cmake --build imgengine/build/ci --target regression_geometry
      - name: Compare optimized and portable scalar output
        run: bash imgengine/tests/regression/scalar_equivalence.sh imgengine/build/ci/imgengine_cli imgengine/build/portable-ci/imgengine_cli
      - name: Run hostile input regression
        run: cmake --build imgengine/build/ci --target regression_security
      - name: Check public ABI
        env:
          IMGENGINE_BUILD_DIR: ${{ github.workspace }}/imgengine/build/ci
        run: python3 imgengine/scripts/check_exported_symbols.py

  native-sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 install -y build-essential cmake ninja-build imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Configure sanitizer build
        run: |
          cmake -S imgengine -B imgengine/build/sanitize-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_SANITIZE=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build sanitizer targets
        run: cmake --build imgengine/build/sanitize-ci --parallel
      - name: Run sanitizer CTest suite
        run: ctest --test-dir imgengine/build/sanitize-ci --output-on-failure
      - name: Run sanitizer progressive JPEG regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_progressive
      - name: Run sanitizer layout geometry regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_geometry
      - name: Run sanitizer hostile input regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_security

  native-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fuzzing dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=60 install -y clang libclang-rt-dev cmake ninja-build imagemagick libturbojpeg-dev libnuma-dev liburing-dev; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Configure libFuzzer target
        run: |
          CC=clang cmake -S imgengine -B imgengine/build/fuzz-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_FUZZ=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build libFuzzer targets
        run: cmake --build imgengine/build/fuzz-ci --target fuzz_input_validator fuzz_decoder --parallel
      - name: Run bounded input validator fuzzing
        run: imgengine/build/fuzz-ci/fuzz_input_validator -max_total_time=30 -max_len=4096
      - name: Run bounded JPEG and PNG decoder fuzzing
        run: |
          mkdir -p /tmp/imgengine-fuzz-corpus
          cp imgengine/photo.jpg /tmp/imgengine-fuzz-corpus/seed.jpg
          convert imgengine/photo.jpg -strip /tmp/imgengine-fuzz-corpus/seed.png
          imgengine/build/fuzz-ci/fuzz_decoder /tmp/imgengine-fuzz-corpus -max_total_time=60 -max_len=8388608

  saas-integration:
    runs-on: ubuntu-latest
    env:
      API_KEYS: integration-test-key
      WEB_API_KEY: integration-test-key
      INTERNAL_API_TOKEN: integration-internal-token
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API, worker, Redis, and PostgreSQL
        working-directory: imgengine-saas/infra
        run: docker compose up --build -d api worker
      - name: Submit JPEG and PNG fixtures and retrieve output
        working-directory: imgengine-saas/infra
        env:
          API_URL: http://127.0.0.1:8000
          API_KEY: integration-test-key
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind: bytes, value: bytes) -> bytes:
              return struct.pack(">I", len(value)) + kind + value + struct.pack(">I", zlib.crc32(kind + value) & 0xFFFFFFFF)

          fixture = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
          fixture += chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00")) + chunk(b"IEND", b"")
          Path("/tmp/fixture.png").write_bytes(fixture)
          PY
          bash ../scripts/integration_smoke.sh ../../imgengine/photo.jpg image/jpeg
          bash ../scripts/integration_smoke.sh /tmp/fixture.png image/png
      - name: Print service logs on failure
        if: failure()
        working-directory: imgengine-saas/infra
        run: docker compose logs --no-color
      - name: Stop integration stack
        if: always()
        working-directory: imgengine-saas/infra
        run: docker compose down --volumes --remove-orphans
  frontend-verification:
    name: Nuxt frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: imgengine-saas/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: imgengine-saas/frontend
        run: npm ci
      - name: Generate Nuxt TypeScript configuration
        working-directory: imgengine-saas/frontend
        run: npx nuxi prepare
      - name: Run frontend unit tests
        working-directory: imgengine-saas/frontend
        run: npm test
      - name: Type-check Nuxt application
        working-directory: imgengine-saas/frontend
        run: npm run typecheck
      - name: Build production Nuxt application
        working-directory: imgengine-saas/frontend
        run: npm run build

  rust-api-container:
    name: Rust API container verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_KEYS: integration-test-key
      WEB_API_KEY: integration-test-key
      INTERNAL_API_TOKEN: integration-internal-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete Compose configuration
        working-directory: imgengine-saas/infra
        run: docker compose config > /tmp/imgengine-compose.rendered.yaml
      - name: Test Compose loopback policy
        run: python3 -m unittest discover -s imgengine-saas/scripts -p 'test_check_compose_loopback_bindings.py'
      - name: Enforce loopback-only bindings for every Compose profile
        run: |
          docker compose --profile s3 --profile observability --file imgengine-saas/infra/docker-compose.yml config --format json > /tmp/imgengine-compose.rendered.json
          python3 imgengine-saas/scripts/check_compose_loopback_bindings.py /tmp/imgengine-compose.rendered.json
      - name: Create isolated integration network
        run: docker network create imgengine-ci
      - name: Build production Rust API image
        run: docker build --file imgengine/rust/Dockerfile --tag imgengine-rust-api:ci imgengine
      - name: Build production Nuxt image
        run: docker build --file imgengine-saas/frontend/Dockerfile --tag imgengine-web:ci imgengine-saas/frontend
      - name: Start isolated Rust API container
        run: |
          docker run --detach --name imgengine-rust-api-ci \
            --network imgengine-ci --network-alias rust-api \
            --publish 127.0.0.1:8001:8000 \
            --env IMGENGINE_API_BIND=0.0.0.0:8000 \
            --env IMGENGINE_API_KEYS=integration-test-key \
            imgengine-rust-api:ci
      - name: Start Nuxt server with private Rust API credentials
        run: |
          docker run --detach --name imgengine-web-ci \
            --network imgengine-ci --network-alias web \
            --publish 127.0.0.1:3000:3000 \
            --env NUXT_IMGENGINE_API_BASE=http://rust-api:8000 \
            --env NUXT_IMGENGINE_RENDER_API_KEY=integration-test-key \
            imgengine-web:ci
      - name: Exercise P5, P8, and P12 over HTTP
        env:
          API_URL: http://127.0.0.1:8001
          API_KEY: integration-test-key
        run: bash imgengine-saas/scripts/rust_api_smoke.sh imgengine/photo.jpg
      - name: Exercise browser-facing P12 Nuxt proxy without an API key
        env:
          FRONTEND_URL: http://127.0.0.1:3000
        run: bash imgengine-saas/scripts/frontend_proxy_smoke.sh imgengine/photo.jpg
      - name: Print container logs on failure
        if: failure()
        run: |
          if docker container inspect imgengine-web-ci >/dev/null 2>&1; then docker logs imgengine-web-ci; fi
          if docker container inspect imgengine-rust-api-ci >/dev/null 2>&1; then docker logs imgengine-rust-api-ci; fi
      - name: Stop integration containers and network
        if: always()
        run: |
          docker rm --force imgengine-web-ci imgengine-rust-api-ci || true
          docker network rm imgengine-ci || true

  docker-linux-verification:
    name: Ubuntu 24.04 Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the repository verification image
        run: docker build --file imgengine/Dockerfile.verify --tag imgengine-verify:ci imgengine
      - name: Run native, Rust, sanitizer, sandbox, and fuzz gates inside Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/imgengine \
            --env IMGENGINE_VERIFY_BUILD_ROOT=/tmp/imgengine-verify-build \
            --env CARGO_TARGET_DIR=/tmp/imgengine-cargo-target \
            --env IMGENGINE_FUZZ_RUNS=5000 \
            imgengine-verify:ci \
            bash scripts/verify_linux.sh
