name: imgengine-native-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  native-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 clang-format imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm
      - name: Configure native build
        run: |
          cmake -S imgengine -B imgengine/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build native targets
        run: cmake --build imgengine/build/ci --parallel
      - name: Run CTest
        run: ctest --test-dir imgengine/build/ci --output-on-failure
      - name: Run CLI smoke test
        run: imgengine/build/ci/imgengine_cli --help
      - name: Run format check
        run: cmake --build imgengine/build/ci --target format-check
      - name: Run progressive JPEG regression
        run: cmake --build imgengine/build/ci --target regression_progressive
      - name: Check public ABI
        env:
          IMGENGINE_BUILD_DIR: ${{ github.workspace }}/imgengine/build/ci
        run: python3 imgengine/scripts/check_exported_symbols.py

  saas-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API, worker, Redis, and PostgreSQL
        working-directory: imgengine-saas/infra
        env:
          API_KEYS: integration-test-key
          INTERNAL_API_TOKEN: integration-internal-token
        run: docker compose up --build -d api worker
      - name: Submit fixture and retrieve output
        working-directory: imgengine-saas/infra
        env:
          API_URL: http://127.0.0.1:8000
          API_KEYS: integration-test-key
        run: bash ../scripts/integration_smoke.sh ../../imgengine/photo.jpg
      - name: Print service logs on failure
        if: failure()
        working-directory: imgengine-saas/infra
        run: docker compose logs --no-color
      - name: Stop integration stack
        if: always()
        working-directory: imgengine-saas/infra
        run: docker compose down --volumes --remove-orphans
