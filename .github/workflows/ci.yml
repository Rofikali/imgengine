name: imgengine-native-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci-scope:
    name: CI scope selection (trusted base)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.select.outputs.version }}
      mode: ${{ steps.select.outputs.mode }}
      infra_p8_parser: ${{ steps.select.outputs.infra_p8_parser }}
      native_build_test: ${{ steps.select.outputs.native_build_test }}
      native_sanitizers: ${{ steps.select.outputs.native_sanitizers }}
      native_fuzz: ${{ steps.select.outputs.native_fuzz }}
      saas_integration: ${{ steps.select.outputs.saas_integration }}
      frontend_verification: ${{ steps.select.outputs.frontend_verification }}
      frontend_browser_quality: ${{ steps.select.outputs.frontend_browser_quality }}
      rust_api_container: ${{ steps.select.outputs.rust_api_container }}
      docker_linux_verification: ${{ steps.select.outputs.docker_linux_verification }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request using trusted base policy
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/ci-scope-select.mjs ]; then
            node scripts/ci-scope-select.mjs
          else
            # First rollout: selector is absent from base main, so run ALL jobs.
            echo 'version=bootstrap-full-v1' >> "$GITHUB_OUTPUT"
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'reason=trusted-base-bootstrap' >> "$GITHUB_OUTPUT"
            for job in infra_p8_parser native_build_test native_sanitizers native_fuzz saas_integration frontend_verification frontend_browser_quality rust_api_container docker_linux_verification; do
              echo "$job=true" >> "$GITHUB_OUTPUT"
            done
          fi

  ci-policy:
    name: CI policy and diff validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate selector and fail-closed gate truth table
        run: |
          set -euo pipefail
          node --test scripts/ci-scope-select.test.mjs scripts/ci-scope-gate.test.mjs scripts/ci-scope.test.mjs
          git diff --check HEAD^ HEAD

  infra-p8-parser:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.infra_p8_parser == 'true' }}
    name: P8 simulation parser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse P8 simulation harness without Docker execution
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace mcr.microsoft.com/powershell:lts-ubuntu-22.04
          pwsh -NoLogo -NonInteractive -File infra/scripts/test-run-p8-vps-sim-parser.ps1

  native-build-test:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.native_build_test == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Install native dependencies with bounded mirror retries
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Keep all native/ABI, format and image-regression prerequisites.
          # ImageMagick provides convert, identify and compare for C regressions.
          # Avoid optional recommended Ghostscript/fonts and 180s APT cutoffs.
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends \
                build-essential cmake ninja-build python3 clang-format imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm; then
              for tool in cc cmake ninja python3 clang-format convert identify compare nasm; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "::error::Missing native build/regression prerequisite: $tool"
                  exit 1
                fi
              done
              exit 0
            fi
            echo "::warning::Native dependency APT bootstrap attempt $attempt/3 failed; retrying mirror/download only."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native build prerequisites unavailable; required build, test, ABI and regression gates remain NOT RUN/FAILED."
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Configure native build
        run: |
          cmake -S imgengine -B imgengine/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build native targets
        run: cmake --build imgengine/build/ci --parallel
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust supervisor tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/imgengine/build/ci
          RUSTFLAGS: -L native=${{ github.workspace }}/imgengine/build/ci
        run: cargo test --manifest-path backend/imgengine-supervisor/Cargo.toml
      - name: Configure portable scalar reference build
        run: |
          cmake -S imgengine -B imgengine/build/portable-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF \
            -DIMGENGINE_BENCH=OFF -DIMGENGINE_PORTABLE_BASELINE=ON \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build portable scalar reference targets
        run: cmake --build imgengine/build/portable-ci --parallel
      - name: Run portable scalar CTest suite
        run: ctest --test-dir imgengine/build/portable-ci --output-on-failure
      - name: Build benchmark targets
        run: cmake -S imgengine -B imgengine/build/bench-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=ON -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF && cmake --build imgengine/build/bench-ci --target bench_lat decoder_bench --parallel
      - name: Run CTest
        run: ctest --test-dir imgengine/build/ci --output-on-failure
      - name: Run CLI smoke test
        run: imgengine/build/ci/imgengine_cli --help
      - name: Run format check
        run: cmake --build imgengine/build/ci --target format-check
      - name: Run progressive JPEG regression
        run: cmake --build imgengine/build/ci --target regression_progressive
      - name: Run layout geometry regression
        run: cmake --build imgengine/build/ci --target regression_geometry
      - name: Compare optimized and portable scalar output
        run: bash imgengine/tests/regression/scalar_equivalence.sh imgengine/build/ci/imgengine_cli imgengine/build/portable-ci/imgengine_cli
      - name: Run hostile input regression
        run: cmake --build imgengine/build/ci --target regression_security
      - name: Check public ABI
        env:
          IMGENGINE_BUILD_DIR: ${{ github.workspace }}/imgengine/build/ci
        run: python3 imgengine/scripts/check_exported_symbols.py

  native-sanitizers:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.native_sanitizers == 'true' }}
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Install sanitizer and native regression dependencies
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # ImageMagick is required by progressive JPEG and geometry regressions:
          # convert, identify, compare. Preserve all ASan/UBSan checks below.
          # Avoid optional Ghostscript/font recommendations and 180s cutoffs.
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends \
                build-essential cmake ninja-build imagemagick libturbojpeg-dev libnuma-dev liburing-dev nasm; then
              for tool in cmake ninja cc convert identify compare nasm; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "::error::Missing required sanitizer/regression dependency: $tool"
                  exit 1
                fi
              done
              exit 0
            fi
            echo "::warning::Sanitizer APT bootstrap attempt $attempt/3 failed; retrying package download only."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Sanitizer prerequisites unavailable; ASan/UBSan gates remain FAILED/NOT RUN."
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Configure sanitizer build
        run: |
          cmake -S imgengine -B imgengine/build/sanitize-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_SANITIZE=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build sanitizer targets
        run: cmake --build imgengine/build/sanitize-ci --parallel
      - name: Run sanitizer CTest suite
        run: ctest --test-dir imgengine/build/sanitize-ci --output-on-failure
      - name: Run sanitizer progressive JPEG regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_progressive
      - name: Run sanitizer layout geometry regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_geometry
      - name: Run sanitizer hostile input regression
        run: cmake --build imgengine/build/sanitize-ci --target regression_security

  native-fuzz:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.native_fuzz == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Install minimal fuzzing dependencies with bounded mirror retries
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Keep native Clang/libFuzzer/sanitizer dependencies. ImageMagick's
          # optional font/ghostscript tree was only used to make a PNG seed.
          # No hard 180-second download cutoff: the 14-minute step cap is
          # the outer bound, while APT handles transient mirror failures.
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends \
                clang libclang-rt-dev cmake ninja-build libturbojpeg-dev libnuma-dev liburing-dev; then
              clang --version
              cmake --version
              ninja --version
              exit 0
            fi
            echo "::warning::APT dependency install attempt $attempt/3 failed; retrying only network/bootstrap step."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native fuzz prerequisites unavailable; fuzz gates remain FAILED/NOT RUN."
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Configure libFuzzer target
        run: |
          CC=clang cmake -S imgengine -B imgengine/build/fuzz-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMGENGINE_FUZZ=ON \
            -DIMGENGINE_LTO=OFF -DIMGENGINE_BENCH=OFF \
            -DIMGENGINE_ENABLE_DSL_CODEGEN=OFF
      - name: Build libFuzzer targets
        run: cmake --build imgengine/build/fuzz-ci --target fuzz_input_validator fuzz_decoder --parallel
      - name: Run bounded input validator fuzzing
        run: imgengine/build/fuzz-ci/fuzz_input_validator -max_total_time=30 -max_len=4096
      - name: Run bounded JPEG and PNG decoder fuzzing
        run: |
          mkdir -p /tmp/imgengine-fuzz-corpus
          cp imgengine/photo.jpg /tmp/imgengine-fuzz-corpus/seed.jpg
          # Fixed synthetic 1x1 red RGB PNG (69 bytes, verified locally).
          # Decodes with the image decoder; no ImageMagick/network needed.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC' \
            | base64 --decode > /tmp/imgengine-fuzz-corpus/seed.png
          test "$(wc -c < /tmp/imgengine-fuzz-corpus/seed.png)" -eq 69
          imgengine/build/fuzz-ci/fuzz_decoder /tmp/imgengine-fuzz-corpus -max_total_time=60 -max_len=8388608

  saas-integration:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.saas_integration == 'true' }}
    runs-on: ubuntu-latest
    env:
      API_KEYS: integration-test-key
      WEB_API_KEY: integration-test-key
      INTERNAL_API_TOKEN: integration-internal-token
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API, worker, Redis, and PostgreSQL
        working-directory: imgengine-saas/infra
        run: docker compose up --build -d api worker
      - name: Submit JPEG and PNG fixtures and retrieve output
        working-directory: imgengine-saas/infra
        env:
          API_URL: http://127.0.0.1:8000
          API_KEY: integration-test-key
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind: bytes, value: bytes) -> bytes:
              return struct.pack(">I", len(value)) + kind + value + struct.pack(">I", zlib.crc32(kind + value) & 0xFFFFFFFF)

          fixture = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
          fixture += chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00")) + chunk(b"IEND", b"")
          Path("/tmp/fixture.png").write_bytes(fixture)
          PY
          bash ../scripts/integration_smoke.sh ../../imgengine/photo.jpg image/jpeg
          bash ../scripts/integration_smoke.sh /tmp/fixture.png image/png
      - name: Print service logs on failure
        if: failure()
        working-directory: imgengine-saas/infra
        run: docker compose logs --no-color
      - name: Stop integration stack
        if: always()
        working-directory: imgengine-saas/infra
        run: docker compose down --volumes --remove-orphans
  frontend-verification:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.frontend_verification == 'true' }}
    name: Nuxt frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable pinned pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test dry-run change classifier
        run: node --test scripts/ci-scope.test.mjs
      - name: Report historical CI-SCOPE-01 dry-run (not selection authority)
        run: node scripts/ci-scope.mjs
      - name: Resolve and create pnpm store
        id: pnpm-store
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          store_path="$(pnpm store path --silent)"
          mkdir -p "$store_path"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm package store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-24-pnpm-${{ hashFiles('imgengine-saas/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-24-pnpm-
      - name: Install locked frontend dependencies
        working-directory: imgengine-saas/frontend
        run: pnpm install --frozen-lockfile
      - name: Verify production audit diagnostics and fail-closed gate
        working-directory: imgengine-saas/frontend
        run: node --test scripts/check-production-audit.node-check.mjs
      - name: Fail on critical or high production dependency advisories
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > /tmp/imgengine-pnpm-audit.json
          audit_exit=$?
          set -e
          node scripts/check-production-audit.mjs /tmp/imgengine-pnpm-audit.json --allow-temporary-picomatch-in-frontend-ci
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported non-critical/high advisories; see the audit summary above."
          fi
      - name: Generate Nuxt TypeScript configuration
        working-directory: imgengine-saas/frontend
        run: pnpm exec nuxi prepare
      - name: Test Free static artifact allowlist and forbidden-server cases
        working-directory: imgengine-saas/frontend
        run: node --test scripts/verify-free-static.node-check.mjs scripts/free-security-headers.node-check.mjs
      - name: Verify draft legal notices block public publication (expected fail-closed)
        working-directory: imgengine-saas/frontend
        run: node --test scripts/check-free-publication-ready.node-check.mjs
      - name: Run frontend unit tests
        working-directory: imgengine-saas/frontend
        run: pnpm test
      - name: Type-check Nuxt application
        working-directory: imgengine-saas/frontend
        run: pnpm run typecheck
      - name: Build production Nuxt application
        working-directory: imgengine-saas/frontend
        run: pnpm run build

  frontend-browser-quality:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.frontend_browser_quality == 'true' }}
    name: Nuxt local-tool browser quality
    runs-on: ubuntu-24.04
    # Version-matched official Ubuntu 24.04 + Node 24 + preinstalled browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --shm-size=1g
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 / Node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned Ubuntu, Node and preinstalled browser engines
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          node -e 'const [major,minor] = process.versions.node.split(".").map(Number); if(major!==24 || minor<15) process.exit(1)'
          test "$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" = "1.58.2"
          for name in chromium-1208 chromium_headless_shell-1208 firefox-1509 webkit-2248; do
            test -d "/ms-playwright/$name" || { echo "::error::Missing preinstalled Playwright engine: $name"; exit 1; }
          done
          corepack enable
          pnpm --version
      - name: Install locked frontend dependencies
        working-directory: imgengine-saas/frontend
        run: pnpm install --frozen-lockfile
      - name: Generate Nuxt production output
        working-directory: imgengine-saas/frontend
        run: pnpm exec nuxi prepare && pnpm run build
      - name: Run local tool browser quality matrix
        working-directory: imgengine-saas/frontend
        # Playwright image runs as root; GitHub's /github/home belongs to pwuser.
        # Firefox refuses a root session using another owner's HOME.
        env:
          HOME: /root
        run: pnpm run test:browser:local-tools
      - name: Generate static Free-only distribution (Docker Ubuntu 24.04)
        working-directory: imgengine-saas/frontend
        run: pnpm run build:free-static
      - name: Reject forbidden runtime, secrets, API and missing static routes
        working-directory: imgengine-saas/frontend
        run: pnpm run verify:free-static
      - name: Run full local-tool and static-boundary browser matrix
        working-directory: imgengine-saas/frontend
        env:
          HOME: /root
          IMGENGINE_STATIC_E2E: '1'
        run: pnpm run test:browser:free-static
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-quality-artifacts
          path: imgengine-saas/frontend/test-results
          if-no-files-found: ignore

  rust-api-container:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.rust_api_container == 'true' }}
    name: Rust API container verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_KEYS: integration-test-key
      WEB_API_KEY: integration-test-key
      INTERNAL_API_TOKEN: integration-internal-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete Compose configuration
        working-directory: imgengine-saas/infra
        run: docker compose config > /tmp/imgengine-compose.rendered.yaml
      - name: Test Compose loopback policy
        run: python3 -m unittest discover -s imgengine-saas/scripts -p 'test_check_compose_loopback_bindings.py'
      - name: Enforce loopback-only bindings for every Compose profile
        run: |
          docker compose --profile s3 --profile observability --file imgengine-saas/infra/docker-compose.yml config --format json > /tmp/imgengine-compose.rendered.json
          python3 imgengine-saas/scripts/check_compose_loopback_bindings.py /tmp/imgengine-compose.rendered.json
      - name: Validate hardened production Compose policy
        run: |
          install -d -m 0700 /tmp/imgengine-production-secrets
          printf '%s\n' integration-test-key > /tmp/imgengine-production-secrets/api-keys
          printf '%s\n' integration-test-key > /tmp/imgengine-production-secrets/render-api-key
          sudo chown root:10001 /tmp/imgengine-production-secrets/api-keys /tmp/imgengine-production-secrets/render-api-key
          sudo chmod 0440 /tmp/imgengine-production-secrets/api-keys /tmp/imgengine-production-secrets/render-api-key
          sudo chown root:10001 /tmp/imgengine-production-secrets
          sudo chmod 0710 /tmp/imgengine-production-secrets
          CADDY_IMAGE='caddy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          IMGENGINE_RUST_API_IMAGE='imgengine-rust-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
          IMGENGINE_WEB_IMAGE='imgengine-web@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc' \
          CADDY_DOMAIN='example.invalid' \
          CADDY_EMAIL='ops@example.invalid' \
          IMGENGINE_API_KEYS_FILE='/tmp/imgengine-production-secrets/api-keys' \
          IMGENGINE_RENDER_API_KEY_FILE='/tmp/imgengine-production-secrets/render-api-key' \
          docker compose --file infra/docker-compose.production.yml config --format json > /tmp/imgengine-production-compose.json
          python3 infra/scripts/verify-production-compose.py /tmp/imgengine-production-compose.json
      - name: Create isolated integration network
        run: docker network create imgengine-ci
      - name: Build production Rust API image
        run: docker build --file backend/Dockerfile --tag imgengine-rust-api:ci .
      - name: Build production Nuxt image
        run: docker build --file imgengine-saas/frontend/Dockerfile --tag imgengine-web:ci imgengine-saas/frontend
      - name: Start isolated Rust API container
        run: |
          docker run --detach --name imgengine-rust-api-ci \
            --network imgengine-ci --network-alias rust-api \
            --publish 127.0.0.1:8001:8000 \
            --env IMGENGINE_API_BIND=0.0.0.0:8000 \
            --env IMGENGINE_API_KEYS_FILE=/run/secrets/imgengine_api_keys \
            --mount type=bind,src=/tmp/imgengine-production-secrets/api-keys,dst=/run/secrets/imgengine_api_keys,readonly \
            imgengine-rust-api:ci
      - name: Start Nuxt server with private Rust API credentials
        run: |
          docker run --detach --name imgengine-web-ci \
            --network imgengine-ci --network-alias web \
            --publish 127.0.0.1:3000:3000 \
            --env NUXT_IMGENGINE_API_BASE=http://rust-api:8000 \
            --env IMGENGINE_RENDER_API_KEY_FILE=/run/secrets/imgengine_render_api_key \
            --mount type=bind,src=/tmp/imgengine-production-secrets/render-api-key,dst=/run/secrets/imgengine_render_api_key,readonly \
            imgengine-web:ci
      - name: Exercise P5, P8, and P12 over HTTP
        env:
          API_URL: http://127.0.0.1:8001
          API_KEY: integration-test-key
        run: bash imgengine-saas/scripts/rust_api_smoke.sh imgengine/photo.jpg
      - name: Exercise browser-facing P12 Nuxt proxy without an API key
        env:
          FRONTEND_URL: http://127.0.0.1:3000
        run: bash imgengine-saas/scripts/frontend_proxy_smoke.sh imgengine/photo.jpg
      - name: Print container logs on failure
        if: failure()
        run: |
          if docker container inspect imgengine-web-ci >/dev/null 2>&1; then docker logs imgengine-web-ci; fi
          if docker container inspect imgengine-rust-api-ci >/dev/null 2>&1; then docker logs imgengine-rust-api-ci; fi
      - name: Stop integration containers and network
        if: always()
        run: |
          docker rm --force imgengine-web-ci imgengine-rust-api-ci || true
          docker network rm imgengine-ci || true
          sudo rm -f /tmp/imgengine-production-secrets/api-keys /tmp/imgengine-production-secrets/render-api-key
          sudo rmdir /tmp/imgengine-production-secrets 2>/dev/null || true

  docker-linux-verification:
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.docker_linux_verification == 'true' }}
    name: Ubuntu 24.04 Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the repository verification image
        run: docker build --file imgengine/Dockerfile.verify --tag imgengine-verify:ci imgengine
      - name: Run native, Rust, sanitizer, sandbox, and fuzz gates inside Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/imgengine \
            --env IMGENGINE_VERIFY_BUILD_ROOT=/tmp/imgengine-verify-build \
            --env CARGO_TARGET_DIR=/tmp/imgengine-cargo-target \
            --env IMGENGINE_FUZZ_RUNS=5000 \
            imgengine-verify:ci \
            bash scripts/verify_linux.sh

  ci-gate:
    name: CI verification gate
    needs: [ci-scope, ci-policy, infra-p8-parser, native-build-test, native-sanitizers, native-fuzz, saas-integration, frontend-verification, frontend-browser-quality, rust-api-container, docker-linux-verification]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Verify every selected job actually passed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/ci-scope-gate.mjs ]; then
            node scripts/ci-scope-gate.mjs
          else
            # Bootstrap PR must pass all nine real checks; no selected skip.
            node - <<'NODE'
          const n = JSON.parse(process.env.CI_NEEDS_JSON ?? '{}')
          const required = ["infra-p8-parser","native-build-test","native-sanitizers","native-fuzz","saas-integration","frontend-verification","frontend-browser-quality","rust-api-container","docker-linux-verification"]
          if (n['ci-scope']?.result !== 'success' || n['ci-policy']?.result !== 'success' ||
              n['ci-scope'].outputs?.version !== 'bootstrap-full-v1' ||
              n['ci-scope'].outputs?.mode !== 'full') throw Error('bootstrap scope/policy failed')
          for (const name of required) {
            const flag = name.replaceAll('-', '_')
            if (n['ci-scope'].outputs[flag] !== 'true' || n[name]?.result !== 'success')
              throw Error('bootstrap missing required passing job: ' + name)
          }
          console.log('CI-SCOPE-02 bootstrap: all nine required checks PASS')
          NODE
          fi
