name: IMGENGINE milestone sync unit verification

on:
  pull_request:
    paths:
      - "scripts/milestone-sync.mjs"
      - "scripts/milestone-sync.test.mjs"
      - "docs/engineering/milestones.json"
      - ".github/workflows/milestone-status-sync.yml"
      - ".github/workflows/milestone-status-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/milestone-sync.mjs"
      - "scripts/milestone-sync.test.mjs"
      - "docs/engineering/milestones.json"
      - ".github/workflows/milestone-status-sync.yml"
      - ".github/workflows/milestone-status-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone-unit:
    name: Milestone generator security and state machine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify deterministic states, dependency ordering and no release escalation
        run: node --test scripts/milestone-sync.test.mjs
