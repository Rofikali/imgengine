name: imgengine-native-performance

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured iterations per benchmark
        required: true
        default: "1000"
      warmup:
        description: Warm-up iterations for bench_lat
        required: true
        default: "100"
      preset:
        description: Native layout template
        required: true
        default: passport-45x35

permissions:
  contents: read

jobs:
  benchmark:
    name: Controlled native benchmark
    runs-on: [self-hosted, linux, x64, imgengine-perf]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify benchmark runner prerequisites
        run: |
          command -v cmake
          command -v ninja
          command -v cc
          command -v sha256sum
          command -v lscpu
          test -f /usr/include/turbojpeg.h
      - name: Record benchmark evidence
        run: |
          results_dir="imgengine/build/benchmark-results/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$results_dir"
          bash imgengine/scripts/check_benchmark_host.sh --strict | tee "$results_dir/preflight.txt"
          bash imgengine/scripts/production_benchmark.sh \
            --iterations '${{ inputs.iterations }}' \
            --warmup '${{ inputs.warmup }}' \
            --preset '${{ inputs.preset }}' \
            --results-dir "$results_dir"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: imgengine/build/benchmark-results/
          if-no-files-found: error
          retention-days: 90
