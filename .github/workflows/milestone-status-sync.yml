name: IMGENGINE milestone status synchronization

# PR events plus main pushes; schedule is a fallback if PR-target is restricted.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: imgengine-milestone-sync
  cancel-in-progress: false

jobs:
  propose-status-update:
    if: >-
      github.repository == 'Rofikali/imgengine' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.ref != 'docs/auto-milestone-status')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # SECURITY: run only trusted main. Never execute any triggering PR code.
      - name: Checkout trusted main with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Test deterministic reconciliation
        run: node --test scripts/milestone-sync.test.mjs scripts/milestone-status-publication.test.mjs

      - name: Generate snapshot from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/milestone-sync.mjs --write

      - name: Open or refresh review-only status PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/auto-milestone-status"
          if [ -z "$(git status --porcelain -- next.md docs/engineering/live-status.md)" ]; then
            echo "No GitHub milestone-status differences; nothing to propose."
            exit 0
          fi
          git diff --check
          git fetch --quiet origin refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "::error::main changed during snapshot; retry on next event"
            exit 1
          }
          command -v gh >/dev/null || { echo "::error::GitHub CLI unavailable"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- next.md docs/engineering/live-status.md
          git commit -m "docs(status): sync PR-verified NOW NEXT and completed milestones"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          remote_author=""
          same_tree=false
          if [ -n "$remote_sha" ]; then
            git fetch --quiet origin "refs/heads/$branch"
            remote_author="$(git log -1 --format=%ae FETCH_HEAD)"
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
              same_tree=true
            fi
          fi

          # An identical branch is NOT success unless a review PR exists.
          # The deterministic planner is tested separately and fails closed on
          # non-bot branches, invalid refs or unexpected GitHub observations.
          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // ""')"
          decision="$(node scripts/milestone-status-publication.mjs \
            "$remote_sha" "$remote_author" "$same_tree" "$open_pr")"
          case "$decision" in
            push-open|push-reuse)
              # Bot-branch only; no automatic merge, deployment or release.
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                push --quiet origin "HEAD:refs/heads/$branch" \
                "--force-with-lease=refs/heads/$branch:$remote_sha"
              ;;
            keep-open|keep-reuse)
              echo "Identical bot branch present; checking review PR."
              ;;
            *)
              echo "::error::Unexpected publication decision"
              exit 1
              ;;
          esac

          case "$decision" in
            keep-open|push-open)
              if ! gh pr create \
                --base main --head "$branch" \
                --title "docs(status): reconcile GitHub PR and milestone board" \
                --body "Automated, review-only milestone snapshot from the approved registry and GitHub PR/check APIs. Changes are limited to next.md and docs/engineering/live-status.md. No automatic merges, security waivers, deployment or public release; review required."; then
                echo "::error::Unable to create review PR. Check repository Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests. Status branch is not a reviewed PR."
                exit 1
              fi
              ;;
            keep-reuse|push-reuse)
              echo "Existing status PR #$open_pr is available for owner review."
              ;;
          esac
