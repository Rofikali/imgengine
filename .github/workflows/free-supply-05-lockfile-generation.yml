name: Free F5-SUPPLY-05 lockfile generation (read-only CI)

# Temporary read-only recovery for environments where direct Docker/pnpm
# execution is unavailable to the connected engineering client. GitHub
# generates the lockfile; it MUST be committed unchanged and validated by
# independent exact-head project CI before any production release.
on:
  push:
    branches: [fix/free/f5-supply-05-production-lockfile]
    paths:
      - "imgengine-saas/frontend/package.json"
      - ".github/workflows/free-supply-05-lockfile-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-tracked-lockfile:
    name: Pinned pnpm lockfile generation and source audit
    if: github.repository == 'Rofikali/imgengine'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --shm-size=1g
    timeout-minutes: 30
    env:
      HOME: /root
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm pinned Ubuntu Docker, Node and pnpm
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          test "$(node -p 'require("./package.json").packageManager')" = pnpm@10.34.9
          corepack enable
          test "$(pnpm --version)" = 10.34.9
      - name: Resolve the reviewed manifest and regenerate lockfile ONLY through pnpm
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const generated=readFileSync('pnpm-lock.yaml','utf8')
          if (!generated.startsWith("lockfileVersion: '9.0'") ||
              generated.length > 2_000_000 ||
              generated.split('\n').some(line => /[ \t]+$/.test(line))) {
            throw Error('pnpm-generated lockfile failed structural/whitespace review')
          }
          console.log('Generated lockfile format/whitespace check passed')
          NODE
          echo "SOURCE_HEAD=$GITHUB_SHA"
          echo "GENERATED_LOCKFILE_SHA256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
      - name: Capture public pnpm-generated lockfile as a downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: f5-supply-05-pnpm-generated-lockfile
          path: imgengine-saas/frontend/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Print bounded base64 lockfile for authorized GitHub connector recovery
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const text=readFileSync('pnpm-lock.yaml','utf8')
          if (text.length < 1000 || text.length > 2_000_000 || !text.startsWith("lockfileVersion: '9.0'")) throw Error('unexpected generated lockfile')
          const encoded=Buffer.from(text,'utf8').toString('base64')
          console.log('GENERATED_LOCKFILE_B64_START')
          for (let i=0;i<encoded.length;i+=3000) console.log('GENERATED_LOCKFILE_B64='+encoded.slice(i,i+3000))
          console.log('GENERATED_LOCKFILE_B64_END')
          NODE
      - name: Strict real source-resolved Free release security audit
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm why glob minimatch --depth 20
          pnpm run verify:free-release-dependencies
      - name: Typecheck and unit tests under the regenerated lockfile
        working-directory: imgengine-saas/frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nuxi prepare
          pnpm run typecheck
          pnpm test
