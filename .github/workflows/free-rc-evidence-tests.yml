name: IMGENGINE Free release candidate evidence unit checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/free-v1-release-preflight.yml"
      - ".github/workflows/free-rc-evidence-tests.yml"
      - "imgengine-saas/frontend/scripts/write-free-candidate-evidence.mjs"
      - "imgengine-saas/frontend/scripts/write-free-candidate-evidence.node-test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-v1-release-preflight.yml"
      - ".github/workflows/free-rc-evidence-tests.yml"
      - "imgengine-saas/frontend/scripts/write-free-candidate-evidence.mjs"
      - "imgengine-saas/frontend/scripts/write-free-candidate-evidence.node-test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detached-evidence-tests:
    name: Detached candidate evidence contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate exact source, verified routes, output detachment and no release escalation
        working-directory: imgengine-saas/frontend
        run: node --test scripts/write-free-candidate-evidence.node-test.mjs
